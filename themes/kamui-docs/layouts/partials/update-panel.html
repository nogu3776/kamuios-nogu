<!-- KamuiOSアップデートパネル -->
<div id="kamui-update-panel" class="kamui-update-panel">
  <!-- フローティングアップデートボタン -->
  <div id="update-floating-button" class="update-floating-button">
    <button id="update-toggle-btn" class="update-btn-primary">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/>
      </svg>
      アップデート
    </button>
  </div>

  <!-- メインパネル -->
  <div id="update-main-panel" class="update-main-panel hidden">
    <div class="update-panel-header">
      <h3>KamuiOSアップデート</h3>
      <button id="update-close-btn" class="update-close-btn">&times;</button>
    </div>

    <div class="update-panel-content">
      <!-- システム情報セクション -->
      <div id="system-info-section" class="update-section">
        <h4>システム情報</h4>
        <div id="system-info-display" class="system-info">
          <div class="info-item">
            <span class="info-label">バージョン:</span>
            <span id="system-version">読み込み中...</span>
          </div>
          <div class="info-item">
            <span class="info-label">ブランチ:</span>
            <span id="git-branch">読み込み中...</span>
          </div>
          <div class="info-item">
            <span class="info-label">カスタムファイル:</span>
            <span id="custom-files-count">読み込み中...</span>
          </div>
        </div>
      </div>

      <!-- アップデートチェックセクション -->
      <div id="update-check-section" class="update-section">
        <h4>アップデート確認</h4>
        <div class="update-actions">
          <button id="check-update-btn" class="update-btn-secondary">
            最新版をチェック
          </button>
          <div id="update-check-result" class="update-result hidden">
            <!-- チェック結果がここに表示される -->
          </div>
        </div>
      </div>

      <!-- 進捗セクション -->
      <div id="update-progress-section" class="update-section hidden">
        <h4>アップデート進捗</h4>
        <div class="progress-container">
          <div class="progress-bar">
            <div id="progress-fill" class="progress-fill" style="width: 0%"></div>
          </div>
          <div id="progress-text" class="progress-text">待機中...</div>
          <div id="progress-percentage" class="progress-percentage">0%</div>
        </div>
      </div>

      <!-- アップデート実行セクション -->
      <div id="update-execute-section" class="update-section">
        <div class="update-actions">
          <button id="start-update-btn" class="update-btn-primary" disabled>
            アップデート実行
          </button>
          <button id="rollback-btn" class="update-btn-warning hidden">
            ロールバック
          </button>
        </div>
      </div>

      <!-- カスタムファイル管理セクション -->
      <div id="custom-files-section" class="update-section">
        <h4>カスタムファイル管理</h4>
        <div class="custom-files-actions">
          <button id="backup-custom-btn" class="update-btn-secondary">
            カスタム設定をバックアップ
          </button>
          <button id="restore-custom-btn" class="update-btn-secondary">
            カスタム設定を復元
          </button>
          <button id="view-custom-files-btn" class="update-btn-info">
            カスタムファイル一覧
          </button>
        </div>
        <div id="custom-files-list" class="custom-files-list hidden">
          <!-- カスタムファイル一覧がここに表示される -->
        </div>
      </div>

      <!-- ログセクション -->
      <div id="update-logs-section" class="update-section">
        <h4>アップデートログ</h4>
        <div class="log-actions">
          <button id="toggle-logs-btn" class="update-btn-info">
            ログを表示/非表示
          </button>
          <button id="clear-logs-btn" class="update-btn-secondary">
            ログをクリア
          </button>
        </div>
        <div id="update-logs" class="update-logs hidden">
          <div class="log-content">
            アップデートログがここに表示されます...
          </div>
        </div>
      </div>

      <!-- アップデート履歴セクション -->
      <div id="update-history-section" class="update-section">
        <details>
          <summary>アップデート履歴</summary>
          <div id="update-history-list" class="update-history">
            読み込み中...
          </div>
        </details>
      </div>
    </div>

    <!-- フッター -->
    <div class="update-panel-footer">
      <div class="update-status">
        <span id="update-status-text">準備完了</span>
        <div id="update-spinner" class="spinner hidden"></div>
      </div>
    </div>
  </div>
</div>

<!-- アップデート通知トースト -->
<div id="update-toast" class="update-toast hidden">
  <div class="toast-content">
    <span id="toast-message"></span>
    <button id="toast-close" class="toast-close">&times;</button>
  </div>
</div>

<style>
.kamui-update-panel {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

  position: fixed;
  bottom: 20px;

  z-index: 1000;
}

.update-btn-primary {
  background: #007bff;
  color: white;
  border: none;
  border-radius: 25px;

  font-size: 14px;

  margin: 0;

}

  background: none;

  font-size: 24px;
  cursor: pointer;
  padding: 0;
  line-height: 1;
}

.update-panel-content {
  padding: 24px;
  max-height: calc(80vh - 120px);
  overflow-y: auto;
}

.update-section {

@keyframes slideIn {

.hidden {
